name: Deploy to Azure

# Automatically deploy backend to Azure when code is pushed to main  
# Uses Azure App Service publish profile for WebDeploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish Release
        run: dotnet publish --configuration Release --output webpublish --no-build

      - name: Deploy to Azure via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp://waws-prod-pn1-037.ftp.azurewebsites.windows.net
          username: ${{ secrets.AZURE_FTP_USERNAME }}
          password: ${{ secrets.AZURE_FTP_PASSWORD }}
          local-dir: ./backend/webpublish/
          server-dir: /site/wwwroot/
