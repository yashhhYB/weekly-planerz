name: Deploy to Azure

# NOTE: Deployment to Azure is paused pending credential resolution
# The application code is production-ready and passes all CI tests
# See: https://github.com/yashhhYB/weekly-planerz/wiki/Deployment-Setup for manual deployment instructions

on:
  # Temporarily disabled - re-enable after Azure FTP credentials are fixed
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Manual trigger only until credentials are fixed

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish Release
        run: dotnet publish --configuration Release --output webpublish --no-build

      - name: Deploy to Azure via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: waws-prod-pn1-037.ftp.azurewebsites.windows.net
          username: ${{ secrets.AZURE_FTP_USERNAME }}
          password: ${{ secrets.AZURE_FTP_PASSWORD }}
          local-dir: ./backend/webpublish/
          server-dir: /site/wwwroot/
